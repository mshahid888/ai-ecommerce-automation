# nginx-example.conf — EXAMPLE reverse-proxy block for the public demo.
#
# >>> THIS IS AN EXAMPLE ONLY. Do not copy blindly: replace every
#     placeholder (server_name, cert paths) with your real values. <<<
#
# Prerequisites on the Hetzner server: nginx installed, certbot + HTTPS
# certificate for your backend domain, then:
#   sudo cp nginx-example.conf /etc/nginx/sites-available/ecommerce-demo
#   # edit server_name + ssl cert paths
#   sudo ln -s /etc/nginx/sites-available/ecommerce-demo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes: the FastAPI service listens on 127.0.0.1:8000 (see
# ecommerce-demo.service). The public demo frontend (Vercel) talks to
# https://api-DOMAIN/health and https://api-DOMAIN/api/...

# Basic per-IP connection throttling at the edge (complements the app's
# sliding-window rate limiter in security/middleware.py).
limit_req_zone $binary_remote_addr zone=demo_api:10m rate=60r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-demo.example.com;   # <<< REPLACE with your real backend domain

    # <<< REPLACE with your certbot-managed certificate paths
    ssl_certificate     /etc/letsencrypt/live/api-demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-demo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers (demo-appropriate baseline; tighten per your policy).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        limit_req zone=demo_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Forward the real client IP so the app's rate limiter works
        # (the service runs uvicorn with --proxy-headers).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The chat endpoint can wait on an LLM call; keep nginx timeouts
        # comfortably above LLM_TIMEOUT_SECONDS (default 15).
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    access_log /var/log/nginx/ecommerce-demo.access.log;
    error_log  /var/log/nginx/ecommerce-demo.error.log;
}

# Redirect plain HTTP to HTTPS (keeps the demo simple and secure).
server {
    listen 80;
    listen [::]:80;
    server_name api-demo.example.com;   # <<< REPLACE
    return 301 https://$host$request_uri;
}
